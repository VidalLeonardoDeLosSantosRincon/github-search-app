<div class="card">
  <img [src]="user.avatar_url" [alt]="user.login" class="avatar" />
  <h2>{{ user.name || user.login }}</h2>
  <p>{{ user.bio }}</p>
  <div class="stats">
    <span>Seguidores: {{ user.followers | formatNumber }}</span>
    <span>Siguiendo: {{ user.following | formatNumber }}</span>
    <span>Repos: {{ user.public_repos }}</span>
  </div>
</div>
